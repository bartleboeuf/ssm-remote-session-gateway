[package]
name = "ssm-remote-session-gateway"
version = "1.1.0"
edition = "2024"
description = "Secure AWS SSM remote session gateway to EC2 and RDS"
authors = ["Bart LEBOEUF"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/bartleboeuf/ssm-remote-session-gateway"
repository = "https://github.com/bartleboeuf/ssm-remote-session-gateway"
rust-version = "1.94.0"  # Specify minimum Rust version
categories = ["development-tools", "command-line-utilities"]
keywords = ["axum", "aws", "aws-sdk-ssm"]
build = "build.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["macros", "json", "http1", "http2", "query"] }
aws-config = { version = "1.8.16", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls", "sso"] }
aws-lc-rs = { version = "1", default-features = false }
aws-credential-types = { version = "1.2.14", default-features = false }
aws-sdk-ec2 = { version = "1.225", default-features = false }
aws-sdk-ecs = { version = "1.124.0", default-features = false }
aws-sdk-iam = { version = "1.108.1", default-features = false }
aws-sdk-rds = { version = "1.132.0", default-features = false }
aws-sdk-sts = { version = "1.103.0", default-features = false }
aws-sdk-ssm = { version = "1.109", default-features = false }
aws-types = { version = "1.3.15", default-features = false }
anyhow = { version = "1.0.102", default-features = false }
directories = { version = "6.0.0", default-features = false }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio", "server", "http1", "http2", "service"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
rcgen = { version = "0.14.7", default-features = false, features = ["aws_lc_rs", "pem"] }
time = { version = "0.3.47", default-features = false, features = ["std"] }
webbrowser = { version = "1.2.1", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }
tokio = { version = "1.52.3", default-features = false, features = ["fs", "io-std", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false }
tower = { version = "0.5.3", default-features = false, features = ["limit", "timeout"] }
tower-http = { version = "0.6.10", default-features = false, features = ["cors", "trace", "limit", "set-header", "compression-br", "compression-gzip"] }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
tracing-appender = { version = "0.2.5", default-features = false }
uuid = { version = "1.23.1", default-features = false, features = ["v4", "serde"] }
which = { version = "8.0.2", default-features = false, features = ["real-sys"] }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
rsa = { version = "0.9.10", default-features = false, features = ["pem"] }
static-serve = { version = "0.6.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
opt-level = 3

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

# Optimize dependencies for release builds
[profile.release.package."*"]
opt-level = 3
debug = false

# Development profile optimizations
[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
incremental = true

# selectively optimize only the heaviest crates:
[profile.dev.package.aws-sdk-ec2]
opt-level = 2
[profile.dev.package.aws-sdk-ecs]
opt-level = 2
[profile.dev.package.aws-sdk-rds]
opt-level = 2
[profile.dev.package.aws-sdk-ssm]
opt-level = 2

# Speed up dev builds by reducing optimization on deps
[profile.dev.package."*"]
opt-level = 1
debug = false

# Used only on Windows to build the vcpkg dependencies
[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
# The revision of the vcpkg repository to use
# https://github.com/microsoft/vcpkg/tags
rev = "2026.04.27"

[package.metadata.vcpkg.target]
x86_64-pc-windows-msvc = { triplet = "x64-windows-static-md", dev-dependencies = ["openssl"] }

[build-dependencies]
winresource = "0.1"

[package.metadata.winresource]
OriginalFilename = "ssm-remote-session-gateway.exe"
LegalCopyright = "Copyright © 2026"


[[bin]]
name = "ssm-remote-session-gateway"
path = "src/main.rs"
